name: Security

# Weekly, so new advisories against unchanged code are caught. ci.yml calls the same
# reusable workflow on every PR and push, where it feeds the merge gate.
on:
  workflow_dispatch:
  schedule:
    - cron: "23 5 * * 1"

permissions: {}

jobs:
  security:
    uses: ZeleMate/workflows/.github/workflows/security.yml@b2e0db40651cb47d108260317d0d11ddba5d6d9c  # unreleased, ZeleMate/workflows#6 (live check)
    permissions:
      contents: read
    with:
      # Semgrep runs on private repos; public repos use CodeQL default setup instead.
      sast: false
